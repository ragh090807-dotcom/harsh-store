<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harsha Clothing</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="top-bar">Premium Clothing Store</div>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">HARSHA</a>

    <nav class="nav" id="navMenu">
      <a href="#">Home</a>
      <a href="#products">Shop</a>
      <a href="track.html">Track</a>
      <a href="login.html">Login</a>
      <a href="account.html">My Orders</a>
    </nav>

    <button class="cart-btn" onclick="openCart()">Cart <span id="cartCount">0</span></button>
  </div>
</header>

<section class="hero">
  <div>
    <h1>Premium Clothing</h1>
    <p>Explore elegant and modern collections.</p>
  </div>
</section>

<section id="products" class="section">
  <h2>Products</h2>
  <div class="product-grid" id="productGrid"></div>
</section>

<footer>
  <p>© 2026 Harsha Clothing</p>
</footer>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-box">
    <h2>Your Cart</h2>

    <div id="cartItems"></div>

    <h3>Total: ₹<span id="cartTotal">0</span></h3>

    <input id="custName" placeholder="Name">
    <input id="custPhone" placeholder="Phone">
    <textarea id="custAddress" placeholder="Address"></textarea>

    <button onclick="sendWhatsAppOrder()">Place Order</button>
    <button onclick="closeCart()">Close</button>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
