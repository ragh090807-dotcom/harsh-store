<input type="email" id="adminEmail" placeholder="Admin Email">
<input type="password" id="adminPassword" placeholder="Password">

<button onclick="loginAdmin()">Login</button>

<p class="error-message" id="loginError"></p>

<div class="admin-header">
  <div>
    <h1>Harsha Clothing Admin</h1>
    <p>Manage products, collections, stock, orders and exports</p>
  </div>

  <div class="admin-actions">
    <button class="export-btn" onclick="exportOrders()">Export Orders</button>
    <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
  </div>
</div>

<div class="admin-grid">

  <div class="section-card">
    <h2 id="productFormTitle">Add New Product</h2>
    <p class="small-note">Use image URL for now. Stock 0 means Out of Stock.</p>

    <input type="hidden" id="editingProductId">

    <input type="text" id="productName" placeholder="Product Name">
    <input type="number" id="productPrice" placeholder="Price">
    <input type="text" id="productCategory" placeholder="Category e.g. Ethnic, Modern, Party">
    <input type="text" id="productSizes" placeholder="Sizes e.g. S,M,L,XL">
    <input type="number" id="productStock" placeholder="Stock Quantity">
    <input type="text" id="productImage" placeholder="Image URL">
    <textarea id="productDescription" placeholder="Product Description"></textarea>

    <button class="save-btn" onclick="saveProduct()">Save Product</button>
    <button class="danger-btn" onclick="clearProductForm()">Clear Form</button>
  </div>

  <div class="section-card">
    <h2>Products</h2>
    <div id="adminProducts"></div>
  </div>

</div>

<div class="section-card">
  <h2>Add Collection</h2>
  <p class="small-note">Collections added here will show on homepage and filter dropdown.</p>

  <input type="text" id="collectionName" placeholder="Collection Name e.g. Wedding">
  <input type="text" id="collectionImage" placeholder="Collection Image URL">

  <button class="save-btn" onclick="saveCollection()">Save Collection</button>

  <div id="adminCollections"></div>
</div>

<div class="section-card">
  <h2>Orders</h2>
  <div id="orders"></div>
</div>
